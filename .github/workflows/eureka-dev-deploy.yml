name: Deploy to Dev (eureka)

# 개발 서버(노트북) 배포: develop 에 push(= PR merge)될 때만 실행한다.
# 보안: pull_request 이벤트는 절대 넣지 않는다. (공개 레포 + self-hosted runner)
on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: dev-laptop
    concurrency:
      group: deploy-eureka-dev
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          $ErrorActionPreference = 'Continue'
          docker build `
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" `
            -t "eureka-dev:${{ github.run_number }}" .
          if ($LASTEXITCODE -ne 0) { Write-Host "build failed"; exit 1 }

      - name: Deploy (replace container)
        run: |
          $ErrorActionPreference = 'Continue'
          $old = docker ps -aq --filter "name=^eureka$"
          if ($old) {
            docker stop eureka | Out-Null
            docker rm eureka | Out-Null
          }
          docker run -d `
            --name eureka `
            --restart unless-stopped `
            --network nirvana `
            -e JAVA_TOOL_OPTIONS="-Xmx256m" `
            -p 127.0.0.1:8761:8761 `
            "eureka-dev:${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "docker run failed"; exit 1 }

          # 이 레포에서 만든 오래된 이미지만 정리 (24시간 이상, 안 쓰는 것)
          docker image prune -a -f --filter "until=24h" --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}" | Out-Null

          # 배포 확인: 최대 90초 동안 5초마다 Eureka 화면이 응답하는지 본다
          for ($i = 1; $i -le 18; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8761/ | Out-Null
              Write-Host "eureka is up"
              exit 0
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          Write-Host "eureka did not respond. last logs:"
          docker logs --tail 50 eureka
          exit 1
